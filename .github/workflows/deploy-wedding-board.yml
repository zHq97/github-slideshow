name: Deploy wedding board to Cloudflare Pages

on:
  push:
    branches: [master, main]
    paths:
      - "wedding-board/**"
      - ".github/workflows/deploy-wedding-board.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedding-board-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy wedding-board --project-name=wedding-liyuan-board --commit-dirty=true
